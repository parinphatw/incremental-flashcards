<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#f6f5f0" />
    <meta
      name="description"
      content="A small daily practice for the things you want to remember."
    />
    <title>Incremental · Flashcards</title>
    <script>
      // Apply appearance before the first paint, including when storage is blocked.
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("incremental-theme") || "system";
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            preference !== "dark" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        const theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = dark
          ? "#17211c"
          : "#f6f5f0";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#17211c"
          : "#f6f5f0";
      })();
    </script>

  </head>

</html>
